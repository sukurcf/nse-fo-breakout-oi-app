[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nse-fo-breakout-oi-app"
version = "0.1.0"
description = "A private, replay-only NSE F&O breakout and OI monitor"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
test = [
    "httpx>=0.28,<1",
]

[tool.setuptools.packages.find]
include = ["nse_fo_breakout*"]

[tool.setuptools.package-data]
nse_fo_breakout = ["static/*"]
